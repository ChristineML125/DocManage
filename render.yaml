services:
  - type: web
    name: docmanage-backend
    runtime: image
    image:
      url: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: PDF_SERVICES_CLIENT_ID
        sync: false
      - key: PDF_SERVICES_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: doclymanage.system@gmail.com
